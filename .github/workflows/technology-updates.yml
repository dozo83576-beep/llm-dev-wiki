name: Technology updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    name: Check technology updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update check
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/ci-local.ps1 -UpdateCheckOnly -IncludeUpdateCheck -WriteGithubSummary

      - name: Manage review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { handleTechnologyUpdateIssue } = require('./tools/technology-update-issue.js');
            const report = fs.readFileSync('technology-update-report.md', 'utf8');
            await handleTechnologyUpdateIssue({ github, context, core, report });
