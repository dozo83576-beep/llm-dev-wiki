name: Wiki audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wiki-audit:
    name: Run wiki audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run wiki audit
        shell: pwsh
        run: ./tools/wiki-audit.ps1

      - name: Run wiki quality report
        shell: pwsh
        run: |
          $report = ./tools/wiki-quality.ps1
          $report | Tee-Object -FilePath wiki-quality-report.md
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Verify INDEX.md is up to date
        shell: pwsh
        run: |
          ./tools/build-index.ps1
          $diff = git diff --exit-code docs/INDEX.md
          if ($LASTEXITCODE -ne 0) {
            Write-Error "docs/INDEX.md is stale. Run 'pwsh ./tools/build-index.ps1' locally and commit."
            exit 1
          }

  rag-evals:
    name: Offline RAG retrieval evals
    runs-on: ubuntu-latest
    needs: wiki-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run offline retrieval unit tests
        run: python -m pytest tests/tools

      - name: Build offline corpus snapshot
        run: python tools/build_embeddings.py --mode offline-text

      - name: Run offline retrieval evals
        run: python tools/run_offline_retrieval_evals.py --min-precision 0.6 --top-k 5 --top-k-strict 10 --warn-rank 3

      - name: Upload evals report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals-report.md

      - name: Verify manifest committed
        shell: pwsh
        run: |
          $diff = git diff --exit-code embeddings/manifest.json
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "embeddings/manifest.json regenerated — commit the update."
          }
