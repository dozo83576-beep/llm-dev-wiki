name: Wiki audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wiki-audit:
    name: Run wiki audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run wiki audit
        shell: pwsh
        run: ./tools/wiki-audit.ps1

      - name: Run wiki quality report
        shell: pwsh
        run: |
          $report = ./tools/wiki-quality.ps1
          $report | Tee-Object -FilePath wiki-quality-report.md
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
