name: Wiki audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wiki-ci:
    name: Run wiki CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run local wiki CI
        shell: pwsh
        run: ./tools/ci-local.ps1 -IncludeToolTests -WriteGithubSummary

      - name: Upload evals report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals-report.md
