name: Wiki audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wiki-audit:
    name: Run wiki audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run wiki audit
        shell: pwsh
        run: ./tools/wiki-audit.ps1

      - name: Run wiki quality report
        shell: pwsh
        run: |
          $report = ./tools/wiki-quality.ps1
          $report | Tee-Object -FilePath wiki-quality-report.md
          $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Verify INDEX.md is up to date
        shell: pwsh
        run: |
          ./tools/build-index.ps1
          $diff = git diff --exit-code docs/INDEX.md
          if ($LASTEXITCODE -ne 0) {
            Write-Error "docs/INDEX.md is stale. Run 'pwsh ./tools/build-index.ps1' locally and commit."
            exit 1
          }
